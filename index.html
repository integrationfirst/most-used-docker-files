<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Container setups</title>
<script>
  // Apply the saved theme, or else the OS preference, before first paint. The toggle code is at the end of the page.
  {
    let saved = null
    try { saved = localStorage.getItem('theme') } catch {}
    document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved
      : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
  }
</script>
<style>
  /* Simpson Strong-Tie brand: see the "Brand" section in README.md. */
  @font-face {
    font-family: Inter; font-style: normal; font-weight: 400; font-display: swap;
    src: url('assets/fonts/Inter-Regular.woff2') format('woff2');
  }
  @font-face {
    font-family: Inter; font-style: normal; font-weight: 700; font-display: swap;
    src: url('assets/fonts/Inter-Bold.woff2') format('woff2');
  }
  :root {
    --white: #FFFFFF;
    --orange: #FF5308;
    --ink: #1D1D1D;
    --black: #000000;
    --grey: #F4F4F4;
    --burnt: #9A3205;
    --slate: #343A40;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* Semantic colours: light theme (the default). */
    --bg: var(--white);
    --surface: var(--grey);
    --surface-strong: var(--white);
    --text: var(--ink);
    --quiet: var(--slate);
    --error: var(--burnt);
    --error-border: var(--burnt);
    --divider: var(--slate);
    --hover-border: var(--slate);
    --selected-border: var(--ink);
    --focus: var(--ink);
    --accent: var(--orange);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: var(--black);
    --surface: var(--ink);
    --surface-strong: var(--black);
    --text: var(--white);
    --quiet: var(--grey);
    --error: var(--white);
    --error-border: var(--orange);
    --divider: var(--slate);
    --hover-border: var(--grey);
    --selected-border: var(--white);
    --focus: var(--white);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Inter, sans-serif; font-weight: 400; font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  header, main, footer { max-width: 1472px; margin: 0 auto; }
  header { padding: 28px 32px 8px; }
  .title { display: flex; align-items: center; gap: 16px; }
  .logo { display: block; width: 110px; height: auto; }
  h1 { margin: 0; font-family: "Helvetica Neue Condensed", Inter, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  /* Brand button: the theme toggle and the viewer's Wrap and Copy buttons. */
  .theme-toggle, .viewer .tools button {
    height: 42px; padding: 0 16px; border: 0; border-radius: 5px;
    background: var(--accent); color: var(--black); white-space: nowrap; cursor: pointer;
  }
  .theme-toggle { flex-shrink: 0; margin-left: auto; }
  .theme-toggle:focus-visible, .viewer .tools button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sub { margin: 4px 0 0; color: var(--quiet); font-size: 12px; }
  .banner {
    margin: 12px max(32px, (100% - 1408px) / 2) 0; padding: 10px 14px; border: 1px solid var(--error-border);
    border-radius: 4px; color: var(--error); font-family: var(--mono); font-size: 12px;
    white-space: pre-wrap;
  }
  .banner[hidden] { display: none; }
  footer { padding: 0 32px 24px; text-align: center; color: var(--quiet); font-size: 12px; }
  footer[hidden] { display: none; }

  main {
    display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 20px;
    padding: 20px 32px 40px; align-items: start;
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .logo { width: 61px; }
  }

  /* List */
  nav { min-width: 0; }
  .group { margin-bottom: 16px; }
  .group h2 {
    margin: 0 0 6px; padding: 0 2px 6px; font-family: "Helvetica Neue Condensed", Inter, sans-serif; font-size: 13px; font-weight: 700;
    border-bottom: 1px solid var(--divider);
  }
  .group ul { list-style: none; margin: 0; padding: 0; }
  .entry {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--surface); border-radius: 4px;
    padding: 7px 10px; margin-bottom: 6px; transition: background .15s, border-color .15s;
  }
  .entry:hover { border-color: var(--hover-border); }
  .entry:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  /* Selected: white fill so the orange bar sits against white, plus a thicker border and bold name. */
  .entry[aria-current="true"] {
    background: var(--surface-strong); border-color: var(--selected-border); border-left: 4px solid var(--accent); padding-left: 7px;
  }
  .entry .name { display: block; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .entry[aria-current="true"] .name { font-weight: 700; }
  .entry .date { display: block; font-family: var(--mono); font-size: 11px; color: var(--quiet); }

  /* Viewer */
  .viewer {
    min-width: 0; background: var(--surface); border: 1px solid var(--surface); border-radius: 4px;
    padding: 14px 16px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto;
  }
  .viewer .path { margin: 0; font-family: var(--mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
  .viewer .meta { margin: 2px 0 12px; font-family: var(--mono); font-size: 11px; color: var(--quiet); }
  .viewer .hint { margin: 0; color: var(--quiet); font-size: 13px; }
  .viewer .error { margin: 0; color: var(--error); font-family: var(--mono); font-size: 12px; }
  .viewer pre {
    margin: 0; padding: 12px; background: var(--surface-strong); border: 1px solid var(--divider); border-radius: 4px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: pre; overflow: auto;
  }
  .viewer pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
  .viewer .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  /* Visually hidden: screen readers announce the copy result, sighted users see it on the button. */
  .viewer .status {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <img class="logo" src="assets/brand/simpson-strong-tie-logo.svg" alt="Simpson Strong-Tie">
    <h1>Container setups</h1>
    <button type="button" class="theme-toggle" id="theme-toggle">Theme: Light</button>
  </div>
  <p class="sub">Files under services/. Pick one to view it. Dates are file modification times on disk.</p>
</header>
<div class="banner" id="banner" role="alert" hidden></div>
<main>
  <nav id="list" aria-label="Setup files"></nav>
  <section class="viewer" id="viewer" aria-live="polite">
    <p class="hint">Select a file to view its contents.</p>
  </section>
</main>
<footer id="version" hidden></footer>
<script>
const INDEX = 'services/index.json'
const VERSION = 'version.json'
const SERVE = 'From the repo root run: python3 -m http.server\nthen open http://localhost:8000/'

const $ = (id) => document.getElementById(id)

const dates = new Map() // path -> formatted date or '-'
let selected = null
let copyTimer = null

function el(tag, cls, text) {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (text !== undefined) node.textContent = text
  return node
}

function showBanner(text) {
  $('banner').textContent = text
  $('banner').hidden = false
}

function fileUrl(path) {
  return 'services/' + path.split('/').map(encodeURIComponent).join('/')
}

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`HTTP ${res.status}`)
  return res.text()
}

function formatDate(header) {
  if (!header) return '-'
  const d = new Date(header)
  if (isNaN(d.getTime())) return '-'
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
}

async function loadDate(path, span) {
  let text = '-'
  try {
    const res = await fetch(fileUrl(path), { method: 'HEAD', cache: 'no-store' })
    if (res.ok) text = formatDate(res.headers.get('Last-Modified'))
  } catch {}
  dates.set(path, text)
  span.textContent = text
  if (selected && selected.path === path) $('viewer').querySelector('.meta').textContent = 'Last modified: ' + text
}

async function select(path, button) {
  clearTimeout(copyTimer)
  if (selected) selected.button.removeAttribute('aria-current')
  selected = { path, button }
  button.setAttribute('aria-current', 'true')

  const viewer = $('viewer')
  viewer.replaceChildren(
    el('p', 'path', 'services/' + path),
    el('p', 'meta', 'Last modified: ' + (dates.get(path) || '…')),
  )
  try {
    const text = await fetchText(fileUrl(path))
    if (selected.path !== path) return
    const pre = el('pre', null, text)
    viewer.append(toolbar(text, pre), pre)
  } catch (err) {
    if (selected.path !== path) return
    viewer.append(el('p', 'error', `Could not load services/${path}: ${err.message}`))
  }
  // In the one-column layout the viewer sits below the list, so bring it into view.
  if (matchMedia('(max-width: 760px)').matches) viewer.scrollIntoView({ block: 'start', behavior: 'smooth' })
}

// The viewer's Wrap and Copy buttons, shown only with a loaded file.
function toolbar(text, pre) {
  const wrapButton = el('button')
  wrapButton.type = 'button'
  const copyButton = el('button', null, 'Copy')
  copyButton.type = 'button'
  const status = el('span', 'status')
  status.setAttribute('role', 'status')

  applyWrap(pre, wrapButton)
  wrapButton.addEventListener('click', () => {
    wrap = !wrap
    applyWrap(pre, wrapButton)
    try { localStorage.setItem('wrap', wrap ? 'on' : 'off') } catch {}
  })
  copyButton.addEventListener('click', async () => {
    let ok = false
    try {
      await navigator.clipboard.writeText(text)
      ok = true
    } catch {}
    if (!copyButton.isConnected) return
    copyButton.textContent = ok ? 'Copied' : 'Copy failed'
    status.textContent = ok ? 'Copied to clipboard' : 'Could not copy to the clipboard'
    clearTimeout(copyTimer)
    copyTimer = setTimeout(() => {
      copyButton.textContent = 'Copy'
      status.textContent = ''
    }, 2000)
  })

  const tools = el('div', 'tools')
  tools.append(wrapButton, copyButton, status)
  return tools
}

function render(files) {
  const groups = new Map()
  for (const path of [...files].sort()) {
    const i = path.indexOf('/')
    const service = i < 0 ? path : path.slice(0, i)
    const name = i < 0 ? path : path.slice(i + 1)
    if (!groups.has(service)) groups.set(service, [])
    groups.get(service).push({ path, name })
  }

  const list = $('list')
  list.replaceChildren()
  for (const service of [...groups.keys()].sort()) {
    const group = el('section', 'group')
    group.append(el('h2', null, service))
    const ul = el('ul')
    for (const { path, name } of groups.get(service)) {
      const button = el('button', 'entry')
      button.type = 'button'
      const date = el('span', 'date', '…')
      button.append(el('span', 'name', name), date)
      button.addEventListener('click', () => select(path, button))
      const li = el('li')
      li.append(button)
      ul.append(li)
      loadDate(path, date)
    }
    group.append(ul)
    list.append(group)
  }
}

// Theme: data-theme is set in <head> before first paint. An explicit choice is saved and wins over the OS
// setting; until then the page follows the OS live.
const darkScheme = matchMedia('(prefers-color-scheme: dark)')
let chosenTheme = null
try {
  const saved = localStorage.getItem('theme')
  if (saved === 'light' || saved === 'dark') chosenTheme = saved
} catch {}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme
  $('theme-toggle').textContent = theme === 'dark' ? 'Theme: Dark' : 'Theme: Light'
}

applyTheme(document.documentElement.dataset.theme)
darkScheme.addEventListener('change', () => {
  if (!chosenTheme) applyTheme(darkScheme.matches ? 'dark' : 'light')
})
$('theme-toggle').addEventListener('click', () => {
  chosenTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
  applyTheme(chosenTheme)
  try { localStorage.setItem('theme', chosenTheme) } catch {}
})

// Wrap: off unless the saved choice is 'on'. The mode carries over to every file viewed afterwards.
let wrap = false
try { wrap = localStorage.getItem('wrap') === 'on' } catch {}

function applyWrap(pre, button) {
  pre.classList.toggle('wrap', wrap)
  button.textContent = wrap ? 'Wrap: On' : 'Wrap: Off'
  button.setAttribute('aria-pressed', String(wrap))
}

async function loadVersion() {
  try {
    const version = JSON.parse(await fetchText(VERSION)).version
    if (typeof version !== 'string' || !version.trim()) return
    $('version').textContent = version.trim()
    $('version').hidden = false
  } catch {}
}

async function init() {
  if (location.protocol === 'file:') {
    showBanner('This page must be served over HTTP: browsers block reading local files from a file:// page.\n' + SERVE)
    $('viewer').replaceChildren(el('p', 'hint', 'Nothing to show when opened from disk.'))
    return
  }
  loadVersion()
  let files
  try {
    const data = JSON.parse(await fetchText(INDEX))
    files = data.files
    if (!Array.isArray(files) || !files.every((f) => typeof f === 'string')) {
      throw new Error('"files" must be an array of paths')
    }
  } catch (err) {
    showBanner(`Could not load ${INDEX} (${err.message}).\n${SERVE}`)
    return
  }
  render(files)
}

init()
</script>
</body>
</html>
